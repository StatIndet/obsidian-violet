name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/check-package.py --tag "$RELEASE_TAG"
          npm ci
          npm run build
          git diff --exit-code -- theme.css
      - name: Package theme
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/Violet
          cp manifest.json theme.css LICENSE dist/
          cp manifest.json theme.css LICENSE dist/Violet/
          cp THIRD_PARTY_NOTICES.md dist/Violet/
          cp licenses/MACTAHOE.txt dist/Violet/MACTAHOE-LICENSE.txt
          cd dist
          zip -q -r "Violet-${RELEASE_TAG}.zip" Violet
          sha256sum manifest.json theme.css LICENSE "Violet-${RELEASE_TAG}.zip" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" dist/manifest.json dist/theme.css dist/LICENSE "dist/Violet-${RELEASE_TAG}.zip" dist/SHA256SUMS --verify-tag --title "Violet ${RELEASE_TAG}" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" dist/manifest.json dist/theme.css dist/LICENSE "dist/Violet-${RELEASE_TAG}.zip" dist/SHA256SUMS --verify-tag --title "Violet ${RELEASE_TAG}" --generate-notes
          fi
